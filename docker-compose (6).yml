version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: crypto_dwh_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_dwh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_dwh.sql:/docker-entrypoint-initdb.d/init_dwh.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_dwh"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build: .
    container_name: crypto_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/crypto_dwh
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build: .
    container_name: crypto_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/crypto_dwh
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DWH_CONN_URI=postgresql+psycopg2://postgres:postgres@postgres:5432/crypto_dwh
    ports:
      - "8080:8080"
    volumes:
      - ./crypto_api_dag.py:/opt/airflow/dags/crypto_api_dag.py
      - ./pipeline.py:/opt/airflow/dags/pipeline.py
    command: webserver

  airflow-scheduler:
    build: .
    container_name: crypto_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/crypto_dwh
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DWH_CONN_URI=postgresql+psycopg2://postgres:postgres@postgres:5432/crypto_dwh
    volumes:
      - ./crypto_api_dag.py:/opt/airflow/dags/crypto_api_dag.py
      - ./pipeline.py:/opt/airflow/dags/pipeline.py
    command: scheduler

volumes:
  pgdata:
